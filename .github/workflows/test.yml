name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: python -m unittest discover -s testcode -p 'test_basic_functions.py' -v

    - name: Run LLM tests
      run: python -m unittest discover -s testcode -p 'test_llm_functions.py' -v

    - name: Run integration tests
      run: python -m unittest discover -s testcode -p 'test_system_integration.py' -v

    - name: Run acceptance tests
      run: python -m unittest discover -s testcode -p 'test_acceptance.py' -v

    - name: Run role auth tests
      run: python -m unittest discover -s testcode -p 'test_role_auth.py' -v

    - name: Run security tests
      run: python -m unittest discover -s testcode -p 'test_security.py' -v

    - name: Run performance tests
      run: python -m unittest discover -s testcode -p 'test_performance.py' -v

    - name: Run all tests (summary)
      run: cd testcode && python test_suite.py
